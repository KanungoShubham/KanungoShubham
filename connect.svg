<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Let's connect">
<style>
  .bg { fill: #0e0f13; }
  .panel { fill: #15171d; stroke: #262a35; stroke-width: 1; }
  .grid { stroke: #1c1f27; stroke-width: 1; }
  .ink { fill: #ece9e1; font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .muted { fill: #8b8f9c; font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  .amber { fill: #f5b544; } .teal { fill: #4fd1c5; } .coral { fill: #ff7a6b; } .violet { fill: #a99bff; }
  .fade { opacity: 0; animation: fade .8s ease forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.4s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.6); } }

  .wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 70% 80%; }
  @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20%,40% { transform: rotate(-8deg); } }
  .spin { transform-origin: 1050px 130px; animation: sp 18s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .cta { animation: cta 3s ease-in-out infinite; }
  @keyframes cta { 50% { opacity: .75; } }
</style>
<defs>
  <clipPath id="frame"><rect x="0" y="0" width="1200" height="260" rx="22"/></clipPath>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5b544"/><stop offset=".55" stop-color="#ff7a6b"/><stop offset="1" stop-color="#a99bff"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#a99bff"/></linearGradient>
  <linearGradient id="trailg" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0"><stop offset="0" stop-color="#8b8f9c"/><stop offset=".5" stop-color="#4fd1c5"/><stop offset=".8" stop-color="#f5b544"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f5b544" stop-opacity=".22"/><stop offset="1" stop-color="#f5b544" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#frame)">
<rect class="bg" width="1200" height="260"/>
<g><line class="grid" x1="0" y1="0" x2="0" y2="260"/><line class="grid" x1="24" y1="0" x2="24" y2="260"/><line class="grid" x1="48" y1="0" x2="48" y2="260"/><line class="grid" x1="72" y1="0" x2="72" y2="260"/><line class="grid" x1="96" y1="0" x2="96" y2="260"/><line class="grid" x1="120" y1="0" x2="120" y2="260"/><line class="grid" x1="144" y1="0" x2="144" y2="260"/><line class="grid" x1="168" y1="0" x2="168" y2="260"/><line class="grid" x1="192" y1="0" x2="192" y2="260"/><line class="grid" x1="216" y1="0" x2="216" y2="260"/><line class="grid" x1="240" y1="0" x2="240" y2="260"/><line class="grid" x1="264" y1="0" x2="264" y2="260"/><line class="grid" x1="288" y1="0" x2="288" y2="260"/><line class="grid" x1="312" y1="0" x2="312" y2="260"/><line class="grid" x1="336" y1="0" x2="336" y2="260"/><line class="grid" x1="360" y1="0" x2="360" y2="260"/><line class="grid" x1="384" y1="0" x2="384" y2="260"/><line class="grid" x1="408" y1="0" x2="408" y2="260"/><line class="grid" x1="432" y1="0" x2="432" y2="260"/><line class="grid" x1="456" y1="0" x2="456" y2="260"/><line class="grid" x1="480" y1="0" x2="480" y2="260"/><line class="grid" x1="504" y1="0" x2="504" y2="260"/><line class="grid" x1="528" y1="0" x2="528" y2="260"/><line class="grid" x1="552" y1="0" x2="552" y2="260"/><line class="grid" x1="576" y1="0" x2="576" y2="260"/><line class="grid" x1="600" y1="0" x2="600" y2="260"/><line class="grid" x1="624" y1="0" x2="624" y2="260"/><line class="grid" x1="648" y1="0" x2="648" y2="260"/><line class="grid" x1="672" y1="0" x2="672" y2="260"/><line class="grid" x1="696" y1="0" x2="696" y2="260"/><line class="grid" x1="720" y1="0" x2="720" y2="260"/><line class="grid" x1="744" y1="0" x2="744" y2="260"/><line class="grid" x1="768" y1="0" x2="768" y2="260"/><line class="grid" x1="792" y1="0" x2="792" y2="260"/><line class="grid" x1="816" y1="0" x2="816" y2="260"/><line class="grid" x1="840" y1="0" x2="840" y2="260"/><line class="grid" x1="864" y1="0" x2="864" y2="260"/><line class