name: Profile — stats + pulse

on:
  schedule:
    - cron: "0 18 * * *" # daily, 11:30 PM IST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "stats.svg"
      - "pulse.svg"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 stats.py

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A stats.svg pulse.svg
          git commit -m "chore: refresh stats and pulse" || exit 0
          git push
